requirements:
# ---------------- 対象資料・取得 ----------------
- {id: P001, src: [M15], stage: [reading], kind: 必須, verify: auto:all_materials_listed,
   text: "「鋼材実験レポート用」の11フォルダを再走査し、含まれる資料をすべて確認する。今回のフォルダ構成を正式な解析対象とする（過去に解析した資料も含む）"}
- {id: P002, src: [M15], stage: [reading], kind: 禁止, verify: auto:no_unconfirmed_exclusion,
   text: "同じ資料・似た資料があっても、確認せずに解析対象から除外しない"}
- {id: P003, src: [M15], stage: [reading], kind: 条件付き, verify: "auto:duplicates_recorded; check:A6",
   text: "完全に同一と確認できたファイルは解析結果を再利用してよい。ただし別資料としての存在を記録する"}
- {id: P004, src: [M15], stage: [reading, integration], kind: 必須, verify: auto:similar_differences_recorded,
   text: "資料同士に違いがある場合は、その違いを確認する"}
- {id: P005, src: [M0], stage: [reading], kind: 必須, verify: "check:A1; check:A2",
   text: "指定フォルダ以下を再帰的に取得し、構造・名前・容量・更新日時・形式を記録。新規アップロードを後から検出し、アップロード途中のファイルを解析しない"}
- {id: P006, src: [M0], stage: [reading], kind: 必須, verify: manual,
   text: "大容量ファイルをメモリに一括で読み込まず、ファイル・ページ・時間区間の単位で逐次処理する"}
- {id: P007, src: [M0], stage: [reading], kind: 必須, verify: "check:A7; check:A8",
   text: "ZIP は安全に展開し（ZIP 爆弾・危険なパスに対処）、内部を順に処理する。サイズ・ディスク・API 使用量の上限を設定可能にする"}
- {id: P008, src: [M14], stage: [reading], kind: 必須, verify: manual,
   text: "Dropbox 直下の .url（Box の Excel 操作解説動画のリンク）は、アクセス・取得できるかを確認した。取得できない場合は原因（ログイン・ダウンロード制限・リンク）を切り分けて報告する（2026-10-20: Box は can_download:false、回避しない）"}

# ---------------- 読み取りの精度 ----------------
- {id: P010, src: [M15, M11], stage: [reading], kind: 必須, verify: "auto:ai_read_complete; check:B14",
   text: "無料の OCR・文字起こしだけで完了扱いにせず、映像・図表・計算式・説明内容まで高精度に読み取る（有料 AI を必要な部分すべてに使用してよい）"}
- {id: P011, src: [M11, M0], stage: [reading], kind: 必須, verify: "auto:ai_read_complete; check:B2",
   text: "動画は音声だけでなく画面内の文字・数式・操作内容も対象。PDF は文章・図表・数式・表を正確に読み取る（ページ単位、取りこぼさない）"}
- {id: P012, src: [M11, M12], stage: [reading], kind: 必須, verify: auto:verification_recorded,
   text: "取得・分割できただけで完了と判断せず、内容の抽出と照合まで確認する"}
- {id: P013, src: [M0], stage: [reading], kind: 必須, verify: "check:B3; check:B4",
   text: "動画の音声を文字起こしし、映像を時間区間ごとに解析し、音声と映像をタイムスタンプで対応付ける。重要な場面は必要に応じて追加解析する"}
- {id: P014, src: [M0], stage: [reading], kind: 必須, verify: manual,
   text: "動画から Excel の操作・画面内の文字・計算式・グラフ・先生の指示を抽出する"}
- {id: P015, src: [M15], stage: [reading], kind: 必須, verify: auto:orientation_handled,
   text: "Excel 操作動画の画面回転、音声欠落、レポート説明動画の通知混入など、以前確認された問題を解消する"}
- {id: P016, src: [M15, M0], stage: [reading], kind: 禁止, verify: auto:no_speech_without_audio,
   text: "元動画に音声が存在しない部分の文字起こしを捏造しない。映像から確認できる内容のみ解析する（読み取れない情報を推測で補完しない）"}
- {id: P017, src: [M20], stage: [reading], kind: 必須, verify: auto:lecture_detail_applied,
   text: "「エクセルの作り方」「レポートの作り方」は、最終成果物の作成時に必要な情報が不足しないよう、解像度・フレーム抽出密度・部分拡大などを必要な限り高める。先生の音声による説明や短時間だけ表示される操作・設定も対象"}
- {id: P110, src: [M21], stage: [reading], kind: 必須, verify: auto:lecture_lossless_frames,
   text: "「エクセルの作り方」「レポートの作り方」の2種類だけは、元映像から取得できる最高品質のフレームを使う（費用が多少増えても高精細を優先）"}
- {id: P111, src: [M21], stage: [reading], kind: 必須, verify: auto:lecture_zoom,
   text: "必要に応じて、セル・数式・グラフ設定・メニュー・書式・操作部分などを個別に拡大して解析する"}
- {id: P112, src: [M21], stage: [reading], kind: 必須, verify: auto:lecture_dense_scan,
   text: "短時間だけ表示される設定変更や操作を見落とさないよう、必要な箇所では抽出間隔を細かくする"}
- {id: P113, src: [M21], stage: [reading, excel, report], kind: 必須, verify: auto:requirements_ledger,
   text: "最終的な Excel・レポート作成時に必要な情報が不足しないことを最優先し、以前の本番解析指示のすべての条件・禁止事項・必須事項も漏れなく確認する"}
- {id: P114, src: [M21], stage: [cost], kind: 禁止, verify: manual,
   text: "意味のない画像拡大や重複解析で費用を増やさない（読み取り精度と情報の網羅性を最大限高める方向で最適化する）"}
- {id: P115, src: [M21], stage: [reading, cost], kind: 必須, verify: auto:config_2350,
   text: "ほかの動画の解析設定は変更しない。追加費用と新しい総額を見積もる"}
- {id: P018, src: [M15, M14], stage: [reading], kind: 必須, verify: auto:per_material_outputs,
   text: "資料ごとに、読み取った内容、重要な数値・式・指示、画像・映像の時刻、解析の確実性、不明点を記録する"}

# ---------------- 先生の実験経過動画・生徒の動画 ----------------
- {id: P020, src: [M15, M16], stage: [reading, integration], kind: 必須, verify: auto:teacher_sequence,
   text: "1→2 の順で続く実験経過動画は「鋼材実験経過先生1」「鋼材実験経過先生2」の2本だけ"}
- {id: P021, src: [M15, M16], stage: [reading], kind: 必須, verify: auto:teacher_trim,
   text: "先生1・2とも、実験映像の再生後に録画の冒頭画面へ戻った時点以降（完全に無音）を解析対象から完全に除外し破棄する（画像抽出・OCR・文字起こし・有料 AI を行わない）"}
- {id: P022, src: [M15], stage: [reading], kind: 禁止, verify: auto:teacher_trim,
   text: "冒頭画面に戻った部分を新しい実験の開始として扱わない"}
- {id: P023, src: [M15], stage: [reading], kind: 必須, verify: auto:teacher_trim,
   text: "無音だけで判断せず、映像が冒頭に戻ったことも確認する。除外開始時刻と判断根拠を記録する。判断できない場合は推測で削除せず確認する"}
- {id: P024, src: [M15, M16], stage: [integration], kind: 必須, verify: auto:teacher_timeline,
   text: "先生1の有効区間→先生2の有効区間の順につなぎ、一続きの実験経過として整理・保存する"}
- {id: P025, src: [M15], stage: [integration], kind: 禁止, verify: auto:teacher_timeline,
   text: "録画されていない時間を勝手に補完しない"}
- {id: P026, src: [M15, M16], stage: [reading, integration], kind: 必須, verify: auto:student_faces,
   text: "生徒の動画は表面と裏面を行き来して撮影、先生の動画は表面だけ。両者とも最初は同じ表面。生徒の動画で表面・裏面の切り替わりを識別し、先生の動画で表面の変化を確認する"}
- {id: P027, src: [M15], stage: [reading], kind: 禁止, verify: auto:student_not_duplicate,
   text: "先生と生徒の動画を、冒頭が似ていても重複動画として除外しない"}
- {id: P028, src: [M15], stage: [integration], kind: 禁止, verify: auto:correspondence_method,
   text: "先生と生徒の撮影時刻を根拠なく一致させない。実験操作や試験体の変化から対応関係を判断する"}
- {id: P029, src: [M15, M16], stage: [reading, integration], kind: 禁止, verify: auto:student_rules,
   text: "生徒の動画を番号だけを理由に時間的に連結しない。先生1・2の連結・末尾除外ルールを生徒の動画に自動適用しない"}
- {id: P030, src: [M15], stage: [reading], kind: 禁止, verify: auto:no_number_continuity,
   text: "先生の実験経過動画以外の「1・2」を番号だけで時間的に連続していると判断しない。それぞれの内容を確認して解析する"}
- {id: P031, src: [M15], stage: [integration], kind: 必須, verify: auto:student_outputs,
   text: "生徒の動画について、表面・裏面の観察結果と先生の動画との対応関係を保存する"}

# ---------------- 意味理解・指示の抽出（M1・M2 の要件は本番でも有効） ----------------
- {id: P040, src: [M1], stage: [semantic], kind: 必須, verify: "check:C1; check:C2; check:C3",
   text: "場面ごとに、何を話しているか・何が表示されているか・何の操作/実験か・その意味・理由・前後との関係・誰への指示か・何の作業か・どの提出物に関係するかを、音声と映像を統合して理解する（文字起こし・OCR・画像説明の羅列を意味理解の完了とみなさない）"}
- {id: P041, src: [M1], stage: [semantic], kind: 必須, verify: "check:C5; check:C11",
   text: "動画全体のテーマ・目的・流れ・論理構造・各場面の役割・作業順序・依存関係・結論・重要事項・訂正・補足・例外・条件変更・繰り返し強調・矛盾の整合・最終要件・学生に理解/実行してほしいことを把握する（動画を見ていない人に説明できる水準）"}
- {id: P042, src: [M1], stage: [semantic], kind: 必須, verify: "check:C8; check:C10",
   text: "局所理解と全体理解を繰り返し照合し再解釈する。前半の説明が後半で訂正された場合、前半だけを最終指示として扱わない。解消できない矛盾は勝手に決めず未解決として記録"}
- {id: P043, src: [M1, M2], stage: [semantic], kind: 必須, verify: "check:D1; check:D7",
   text: "指示を A禁止・B非推奨・C必須・D要望・E推奨・F任意・G条件付き・H その他/判断不能 の8分類で可能な限り漏れなく抽出（8分類を維持）"}
- {id: P044, src: [M1], stage: [semantic], kind: 禁止, verify: "check:D1; check:D8",
   text: "AI の推測で指示の強さを変えない（禁止→推奨、推奨→必須などにしない）。明示された内容と AI の推論を必ず区別する。判断が難しいものは要確認として保存"}
- {id: P045, src: [M1], stage: [semantic], kind: 必須, verify: "check:D2; check:D3; check:D4; check:D6",
   text: "各指示に16項目（内容・分類・対象作業・適用条件・動画名・開始/終了時刻・関連画面・操作・発言・前後の文脈・確実性・未確認事項・明示/推論・関連指示・訂正等との関係）を記録し、元の時刻に戻って検証できるようにする"}
- {id: P046, src: [M1, M2], stage: [semantic], kind: 必須, verify: "check:O2; check:D9",
   text: "3段階（第1回 全体理解、第2回 指示の重点抽出、第3回 元動画との照合と見落とし検証）を維持する。曖昧な重要指示は該当箇所の映像と音声を再解析し、必要なら範囲を広げる"}
- {id: P047, src: [M1], stage: [semantic], kind: 禁止, verify: check:O2,
   text: "「全区間を処理した」と「すべての指示を理解できた」を混同しない。網羅率は処理済み時間に基づき、指示の検出率に根拠のない数値を出さない"}
- {id: P048, src: [M2, CLAUDE], stage: [semantic], kind: 禁止, verify: check:D5,
   text: "発言者が不明な場合は先生の指示と断定しない（話者識別はしていない。利用者が確認した場合のみ semantic.video_speaker: teacher）"}
- {id: P049, src: [M1], stage: [integration], kind: 必須, verify: "check:E3; check:E4; check:E5; check:E6",
   text: "複数の動画・PDF・Excel・レポート作成説明・事前説明を横断して、目的・手順・データ処理・Excel/レポートの作り方・作業順序・依存関係・提出物と要件・共通指示・補足・訂正・矛盾を理解。資料間の矛盾は双方の根拠とともに報告し、勝手に採用しない。動画全体の理解と実験全体の理解を区別して保存"}
- {id: P050, src: [M1], stage: [semantic, integration], kind: 必須, verify: auto:semantic_outputs,
   text: "出力: 場面ごとの意味解析・動画全体の理解・説明内容と手順・指示一覧・分類/条件/根拠・統合要件・実験全体の理解・未確認事項・矛盾・訂正/補足/例外・失敗箇所・網羅率と検証状況。後から指示を検索し元の時刻・資料を確認できる"}
- {id: P051, src: [M0], stage: [semantic], kind: 必須, verify: auto:semantic_outputs,
   text: "解析結果を 目的・概要／実験手順／測定データ／Excel 作成方法／レポート作成方法／計算式・グラフ／提出物の要件／先生の指示／注意事項・禁止事項／不明点・矛盾 に分類する"}
- {id: P052, src: [M0, M2], stage: [semantic], kind: 必須, verify: "check:D8; check:H1",
   text: "先生の指示と AI 自身の推測を区別し、AI の解析結果を無条件に信用しない（最初の結論を正解として扱わず、独立に再確認できる）"}

# ---------------- チェック・検証 ----------------
- {id: P060, src: [M2, M3], stage: [reading, semantic, integration, excel, report], kind: 必須, verify: auto:check_catalog,
   text: "システム全体で必要なチェックを網羅的に設計し最適な工程に組み込む（M3 で訂正: 不足分だけでなく全体を設計）。結果は 成功・不一致・要確認・未検証 を区別して記録"}
- {id: P061, src: [M2], stage: [excel, report], kind: 必須, verify: "check:F1; check:F2; check:F3; check:F7; check:F11",
