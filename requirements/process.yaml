# 利用者（本人）がこれまでに出した指示から抽出した、本番解析・提出物作成に適用する要求事項の台帳。
# 資料の内容（先生の指示）は含めない（それは解析結果として work/ に出力され、コミットしない）。
#
# 方針
# - 指示は削除しない。後の指示で訂正・置き換えられたものは status: superseded とし superseded_by で結ぶ
# - 矛盾・緊張関係は conflicts に双方を記録し、勝手にどちらかを捨てない（resolution に判断と根拠、未決なら unresolved）
# - stage: どの工程で守る・確かめるか（reading 読み取り / semantic 意味理解・指示抽出 / integration 資料横断 /
#   excel・report 提出物の作成（将来）/ style 文章調整 / feedback 教授の指摘 / operations 運用 / security 安全 / cost 費用 / dev 開発の進め方）
# - verify: 確認方法。check:<ID> は src/structlab/checks/catalog.py のチェック、auto:<名前> は structlab requirements verify の自動確認、
#   manual は人が確認（自動で確かめられないものを確認済みにしない）
# - source: msg は会話の何番目の利用者メッセージか（0 始まり）と時刻（UTC）。CLAUDE.md はリポジトリの作業指示
