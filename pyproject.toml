[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structlab"
version = "0.1.0"
description = "建築構造実験の資料（PDF・動画・画像・Excel・ZIP）を Dropbox から逐次取得して階層化・解析するツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "dropbox>=12.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "numpy>=1.26",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
ai = ["anthropic>=1.0"]
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0", "reportlab>=4.0", "jsonschema>=4.0"]
exam = ["reportlab>=4.0", "python-docx>=1.1", "sympy>=1.12", "requests>=2.31"]
browser = ["playwright>=1.40"]

[project.scripts]
structlab = "structlab.cli:main"
structlab-exam = "structlab.exam.cli:main"

[tool.setuptools.package-data]
"structlab.exam" = ["*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 時間のかかるテスト（動画・大容量）",
]
